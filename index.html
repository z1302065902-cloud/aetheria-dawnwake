<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <meta name="theme-color" content="#07090f" />
  <!-- link previews (itch / Afdian / social): absolute URLs, so they resolve from any host -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Aetheria: Dawnwake · 以太利亚 · 黎明觉醒" />
  <meta property="og:description" content="单人幻想即时战略：三幕十关、3 英雄、Roguelite 遗物、Boss 战。浏览器打开即玩，中英双语，零第三方素材。" />
  <meta property="og:image" content="https://z1302065902-cloud.github.io/aetheria-dawnwake/og.png" />
  <meta property="og:url" content="https://z1302065902-cloud.github.io/aetheria-dawnwake/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101a33'/%3E%3Cpath d='M16 5l7 11-7 11-7-11z' fill='%23ffd257'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #07090f;
      font-family: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game-root { position: fixed; inset: 0; }
    canvas { display: block; touch-action: none; }
    /* Loading splash, removed by BootScene as soon as the canvas is live */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 40%, #16224a 0%, #07090f 70%);
      z-index: 20; transition: opacity .4s ease;
    }
    #splash h1 {
      font-size: 34px; letter-spacing: 6px; color: #ffd98a;
      text-shadow: 0 0 22px rgba(255,190,80,.45);
    }
    #splash p { color: #8fa2c9; font-size: 13px; letter-spacing: 2px; }
    #splash .bar { width: 240px; height: 4px; background: #1b2440; border-radius: 3px; overflow: hidden; }
    #splash .bar i { display: block; height: 100%; width: 30%; background: linear-gradient(90deg,#ffd98a,#f0a63c); animation: slide 1.1s infinite ease-in-out; }
    @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
    #splash.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="splash">
    <h1>AETHERIA</h1>
    <p>DAWNWAKE · 黎明觉醒</p>
    <div class="bar"><i></i></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
